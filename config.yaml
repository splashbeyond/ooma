version: 0
coins: [BTC, ETH, SOL, HYPE]
timeframes: [1h, 4h, 1d]
paper:
  start_equity: 10000
  taker_fee_bps: 4.5
  extra_slippage_bps: 2
  exec_delay_sec: 3
risk:
  max_risk_per_trade: 0.01
  max_leverage: 3
  max_positions: 3
  daily_loss_cap: 0.03
  drawdown_kill: 0.10
  min_confidence: 0.6
price_action:
  ma_periods: [20, 50, 200]
  ma_type: ema
  atr_period: 14
  pivot_lookback: 5
  level_cluster_atr: 0.5
  range_min_bars: 20
  range_max_atr: 3.0
  breakout_atr: 0.5
  breakout_vol_mult: 1.5
  retest_bars: 10
history:
  warmup_bars: 250
  holdout_frac: 0.25
  backtest_risk_usd: 100
learning:
  min_n: 30
  min_evidence_per_hypothesis: 10
  require_human_approval: true
wallets:
  min_trades_to_score: 30
  cohort_top_decile: 10
  cohort_bottom_decile: 1
predict:
  horizons: [1, 4, 24]      # hours ahead for the binary question
  cost: 0.0013              # round-trip fees + slippage, as a fraction
  margin: 0.03              # |p - 0.5| needed to count as a confident call
  min_eff: 30               # effective samples (n / horizon) before a predictor can be trusted
  alpha: 0.05               # Bonferroni-adjusted significance for trust
  cap: 500                  # max live predictors per horizon
  spawn_per_day: 25
llm:
  model: z-ai/glm-5.3-flash          # OpenRouter; ~$0.03/M in, $0.08/M out
  fallbacks: [z-ai/glm-5.3]
  daily_budget_usd: 2.0              # hard stop for unattended runs (sessions pause until the next UTC day)
execution:                           # candle-backtest execution model (see execution/model.py)
  fees: {taker_bps: 4.5, maker_bps: 1.5, staking_discount: 0.0}   # HL base tier
  half_spread_bps: {BTC: 0.15, ETH: 0.25, SOL: 0.6, HYPE: 1.0}    # recalibrate with `ooma exec-calibrate`
  impact_coeff: 0.5
  stop_extra_bps: 3.0
  touch_fill_prob: 0.35
  participation_cap: 0.10
  leverage: 3.0
  rules:                             # from `meta`: szDecimals, maxLeverage. min_notional unverified
    BTC: {sz_decimals: 5, max_leverage: 40}
    ETH: {sz_decimals: 4, max_leverage: 25}
    SOL: {sz_decimals: 2, max_leverage: 20}
    HYPE: {sz_decimals: 2, max_leverage: 10}
director:
  focus: []              # empty = the whole liquid Hyperliquid universe; or list coins to restrict
  top_n: 17              # how many of the most liquid perps (24h volume >= $5M)
  hypotheses: 2          # ideas per research session (kept small so sessions are fast and cheap)
  rounds: 1              # refinements per idea, from TRAIN metrics only
  pause_s: 120           # rest between back-to-back sessions
  incubation: soft         # plausible candidates paper-trade for free; live evidence is the real gate
  max_incubating: 12       # paper-trading slots
  fwd_max_days: 10         # retire a paper-trader that has not earned 'active' by then (frees the slot)
