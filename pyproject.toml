[project]
name = "ooma"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "polars", "pandas", "numpy", "duckdb", "pydantic>=2", "httpx",
  "websockets", "pyyaml", "typer",
]

[project.optional-dependencies]
dev = ["pytest"]
kronos = ["torch", "huggingface_hub"]

[project.scripts]
ooma = "ooma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ooma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Hyperliquid API"]
