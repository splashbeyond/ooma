[project]
name = "analyst"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "polars", "pandas", "numpy", "duckdb", "pydantic>=2", "httpx",
  "websockets", "pyyaml", "typer",
]

[project.optional-dependencies]
dev = ["pytest"]
kronos = ["torch", "huggingface_hub"]

[project.scripts]
analyst = "analyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
